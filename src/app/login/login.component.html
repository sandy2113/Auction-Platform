<div style="height: 100vh;display: flex;justify-content: center;align-items: center;">
    <div style="display: flex;justify-content: center; height: fit-content;">
    <div class="container" [ngClass]="{ 'right-panel-active': isSignUp }" id="container">
      <div class="form-container sign-up-container">
        <form (ngSubmit)="insertUser()" #signUpForm="ngForm">
          <h1>Create Account</h1>
        
          <div class="social-container">
            <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
            <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
          </div>
        
          <span>or use your email for registration</span>
        
          <input type="text" placeholder="Name" [(ngModel)]="name" name="name" required />
          <input type="email" placeholder="Email" [(ngModel)]="email" name="email" required />
          <input type="password" placeholder="Password" [(ngModel)]="password" name="password" required />
        
          <button type="submit" [disabled]="signUpForm.invalid">Sign Up</button>
        </form>
        
      </div>
    
      <div class="form-container sign-in-container">

        <form (ngSubmit)="getLogin()">
          <h1>Sign in</h1>
          <div id="buttonDiv" style="margin-bottom: 10px; margin-top: 10px;">
            <div class="social-container">
              <div id="g_id_onload"
                data-client_id="YOUR_CLIENT_ID"
                data-context="use"
                data-ux_mode="popup"
                data-auto_prompt="false">
              </div>
              <div class="g_id_signin"
                data-type="standard"
                data-shape="pill"
                data-theme="filled_blue"
                data-text="signin_with"
                data-size="medium"
                data-logo_alignment="left">
              </div>
            </div>
          </div>
        
          <span>or use your account</span>
          <input type="email" placeholder="Email" [(ngModel)]="email" name="email" required />
          <input type="password" placeholder="Password" [(ngModel)]="password" name="password" required />
          <a href="#">Forgot your password?</a>
          <button type="submit">Sign In</button>
        </form>
        
      </div>
    
      <div class="overlay-container">
        <div class="overlay">
          <div class="overlay-panel overlay-left">
            <h1>Welcome Back!</h1>
            <p>To keep connected with us please login with your personal info</p>
            <button class="ghost" (click)="switchToSignIn()">Sign In</button>
          </div>
          <div class="overlay-panel overlay-right">
            <h1>Hello, Friend!</h1>
            <p>Enter your personal details and start journey with us</p>
            <button class="ghost" (click)="switchToSignUp()">Sign Up</button>
          </div>
        </div>
      </div>
    </div>
    </div>
    </div>
